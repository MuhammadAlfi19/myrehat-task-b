
name: myrehat-task-b

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
        - server_env
      args:
        NEXT_PUBLIC_SERVER_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL before building}

    init: true

    env_file:
      - path: apps/web/.env
        required: false

    environment:
      NODE_ENV: production
      SERVER_URL: http://server:3000
      NEXT_PUBLIC_SERVER_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}

    depends_on:
      server:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env

    init: true

    env_file:
      - path: apps/server/.env
        required: false

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL}
      CORS_ORIGIN: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-placeholder}

    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

secrets:
  web_env:
    file: apps/web/.env

  server_env:
    file: apps/server/.env
